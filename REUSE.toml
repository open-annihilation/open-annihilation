# Copyright and licence of the engine's files that carry no header of their
# own: documents, images and data. Every other file of the engine carries
# two SPDX header lines, which tools/spdx_headers.py adds and checks (the
# licensing-check test). A file's own header takes precedence over these
# annotations. Licence texts and third-party notices (LICENSE, licenses/)
# state their own terms. Every copyright line names the project's authors
# and points to COPYRIGHT, which names the holder once for the repository,
# except the SDL patches', which keep SDL's terms, and the branding's at the
# end, which is not under the project's licence.
#
# The paths name the engine's own directories only. '*' matches within one
# directory and '**' across directories.
#
# The file is written in the REUSE specification's format (version 1), but
# licensing-check is what the engine holds its files to. The tree does not
# claim full REUSE compliance, which would also want each licence text
# under LICENSES/ named by its SPDX identifier and the third-party notices
# in licenses/ annotated with their own terms.
version = 1

# The documents, the copyright statement, and the diagrams and tables in
# docs/.
[[annotations]]
path = [
    "*.md",
    "COPYRIGHT",
    ".github/**.md",
    "cmake/**.md",
    "docs/**",
    "src/**.md",
    "tests/**.md",
    "tools/**.md",
    "tools/nix/**.nix",
    "flake.nix",
    "flake.lock"
]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# Data that cannot hold a comment: the checks' baselines and tables, JSON
# anywhere in the engine's directories, the macOS bundle's Info.plist
# template and the Windows program's manifest. The settings picture pin is
# a table of hashes the pixel gate requires left unchanged, and the Game
# files screen's and the folder chooser's layout digests tables of hashes of
# their layouts.
[[annotations]]
path = [
    "*.json",
    "cmake/**.json",
    "src/**.json",
    "src/app/Info.plist.in",
    "src/app/open-annihilation.manifest",
    "src/ui/engine-settings/tests/pixels.txt",
    "src/ui/folder-chooser/tests/layout-digests.txt",
    "src/ui/game-files/tests/layout-digests.txt",
    "tests/**.json",
    "tools/**.json",
    "tools/**.txt",
]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The whole files of the language-pack tests, which the game shows as they
# are and so cannot hold a comment: briefings and the like under each pack's
# files/ folder, and the warm-up lists.
[[annotations]]
path = [
    "src/data/languages/tests/pseudo-pack/files/**",
    "src/data/languages/tests/**/warmup.txt",
]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The files of the builds for other platforms (platforms/) that cannot hold
# a comment: their documents, bundle property lists and templates, launch
# screens, data, images, build settings and entitlements, and the Steam
# Input templates the Steam Deck package carries.
[[annotations]]
path = [
    "platforms/**.md",
    "platforms/**.plist",
    "platforms/**.plist.in",
    "platforms/**.storyboard",
    "platforms/**.json",
    "platforms/**.png",
    "platforms/**.xcconfig",
    "platforms/**.entitlements",
    "platforms/**.vdf",
]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The short encoded tones the music decoder's tests decode
# (src/audio/tests/README.md says how they were made).
[[annotations]]
path = "src/audio/tests/data/**"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The automation protocol's test frames, which make_vectors.py beside them
# writes and explains.
[[annotations]]
path = "src/app/automation/tests/vectors/**.bin"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The changes the build makes to the pinned SDL release (tools/sdl-patches).
# Each patch holds lines of the SDL file it changes, whose authors that file
# names, and the change, which the project's authors offer to SDL under
# SDL's own licence, zlib, so each patch keeps SDL's terms.
[[annotations]]
path = "tools/sdl-patches/**.patch"
precedence = "override"
SPDX-FileCopyrightText = [
    "The authors of the SDL files each patch changes, as each file names them",
    "The Open Annihilation Authors; see COPYRIGHT",
]
SPDX-License-Identifier = "Zlib"

# Adapted from the Contributor Covenant, version 2.1, which is distributed
# under the Creative Commons Attribution 4.0 licence.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

# The Open Annihilation branding: the icon, the settings icon and the mods
# icon, from the Open Annihilation branding repository, the icons
# tools/make_icons.py makes from the icon, which the builds put in the game,
# and the settings and mods icons at 256 pixels, which the game embeds for
# its settings and Library buttons, and the same icons at 512 pixels, which
# a large window draws. All
# rights reserved: no licence to use, copy, modify or distribute them is
# granted, under the project's licence or otherwise, without the holder's
# prior written permission
# (licenses/LicenseRef-OpenAnnihilation-Branding.txt).
[[annotations]]
path = [
    "branding/open-annihilation-256.png",
    "branding/open-annihilation-512.png",
    "branding/open-annihilation-icon.png",
    "branding/open-annihilation-mods-256.png",
    "branding/open-annihilation-mods-512.png",
    "branding/open-annihilation-mods-icon.png",
    "branding/open-annihilation-settings-256.png",
    "branding/open-annihilation-settings-512.png",
    "branding/open-annihilation-settings-icon.png",
    "branding/open-annihilation.icns",
    "branding/open-annihilation.ico",
]
precedence = "override"
SPDX-FileCopyrightText = "Steve Gray"
SPDX-License-Identifier = "LicenseRef-OpenAnnihilation-Branding"

# The LZMA SDK decoder, public domain, kept unchanged (see ATTRIBUTIONS.md).
# These files sit under a vendor directory, which the header check leaves to
# its authors, so the annotation is the record of their terms.
[[annotations]]
path = "src/formats/lzma/vendor/**"
SPDX-FileCopyrightText = "Igor Pavlov"
SPDX-License-Identifier = "LZMA-SDK-9.22"

# The small streams the LZMA tests decode, written by xz.
[[annotations]]
path = "src/formats/lzma/tests/data/**"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The small UDIF image the disk-image tests open. It is a volume made for
# the tests, not a published installer.
[[annotations]]
path = "src/formats/udif/tests/data/**"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The small setup body the Windows-installer test reads. It holds no game data.
[[annotations]]
path = "src/formats/inno-setup/tests/data/**"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# Made-up Ridge packages the mutation pipeline tests share. Their text files
# carry their own header lines; the small pictures, which the tests compare
# byte for byte, cannot.
[[annotations]]
path = "tests/data/mutators/**"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# Made-up brain packages the brains tests seat, and the sample package whose
# file bytes the Classic fingerprint test hashes. Some carry their own header
# lines; the sample cannot without changing the bytes it is about.
[[annotations]]
path = ["src/sim/brains/tests/data/**", "src/sim/brains/tests/classic-sample/**"]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The learned scout example's network. A .oann file cannot hold a header.
[[annotations]]
path = "brains/examples/learned-scout/nets/*.oann"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The made-up Ridge maps the map-rule tests read. An OTA has no comment
# style the licence check knows, so these carry no header lines.
[[annotations]]
path = "src/data/mutators/tests/map_rules/**.ota"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"
