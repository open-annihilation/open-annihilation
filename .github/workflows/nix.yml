# The flake's own builds.
#
# This is not a second copy of the build workflow beside it: that one builds
# the engine for each system with that system's toolchain and tests it. What
# this covers is what only the flake can — that every output evaluates, and the
# Windows executables cross-compiled from Linux, which no job there produces.
#
# Windows 95 is left out of the matrix: its output rebuilds mingw-w64 and its C
# run-time library from source, which is the better part of an hour, and it is
# not a target anyone is asked to work on. `nix build .#win95` runs it on the
# machine that wants it.
name: Flake
on: [push, pull_request, workflow_dispatch]
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: The flake's outputs evaluate
        run: nix flake check -L

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installable:
          - "default"
          - "windows"
          - "windows-i686"
    name: build (${{ matrix.installable }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build -L .#${{ matrix.installable }}
