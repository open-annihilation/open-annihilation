# The action registry, catalogue 1: every key, button and wheel turn the game
# answers, with its default chord. tools/gen_input_actions.py checks it and
# writes src/data/input-actions/src/actions.inc. input-actions-sync fails while
# that table differs from this file, or this file breaks a rule.
#
# Top level: input-actions (must be 1), contexts, conditions, areas, families,
# actions. gui. and select.category- actions are made at load, from families,
# and are not listed here.
#
# Context fields: parent (null only on global), overlay and title. The order
# of the contexts is the bit order of an action's context mask.
# Conditions: names is the bit order. exclusive pairs cannot both hold on one
# action, and exclusive() is true when two masks hold a pair on opposite sides.
# Area fields: order (the editor's category order) and title.
#
# Family fields: area, context, kind, by, source, and when they apply
# default-template (kept as text, not parsed as a chord) and order-panel
# (area and context for an order-panel gadget).
#
# Action fields, always: area, order, context, kind, source, words.
#   area, order   the editor category and the order within it, from 1
#   context       where the action is read
#   when          conditions inside that context; absent means none
#   kind          press, repeat, hold, modifier, pointer or wheel
#   by            letter or place; required when a default's trigger is a
#                 character or a key position
#   source        3.1c, OA, data, or a hack id. An action whose sources are
#                 all hack ids exists only while one of those hacks is on
#   default       up to four chords of the OA default layout; absent means unbound
#   words         name and description, the English texts (there are no word ids)
#   replaces      the base action a hack action stands in for; no default then
#   hacks         hack id to {default and/or when}: what the defaults or the
#                 conditions become while that hack is on
#   left-click-default  a pointer role's chord in the left-click interface
#   target        where a pointer or wheel action lands
#   gadget        the order-panel gadget word the action presses
#   fixed         true only for Escape's one fixed job (chat.cancel)
#   latchable     a hold or modifier that may latch
#   confirmable   an action that may require a hold to confirm
#   repeatable    a repeat action the repeat helper may apply to
#   pad           an Action enumerator of the pad controls
#   touch         latch., radial. or select. and that enum's enumerator
#   aliases       old ids kept after a rename
#
# A printable key of a by: place action is its position (@KeyW, @Digit1,
# @Equal, @Minus, @Slash, @Backslash, @Backquote), not the character. Whether
# an @ name is a real key position is checked by the C++ grammar (K04).

input-actions: 1

contexts:
  global:
    parent: null
    overlay: false
    title: Everywhere
  oa-screens:
    parent: global
    overlay: false
    title: Open Annihilation
  menus:
    parent: global
    overlay: false
    title: Menus
  match:
    parent: global
    overlay: false
    title: Match
  play:
    parent: match
    overlay: false
    title: Playing
  watch:
    parent: match
    overlay: false
    title: Watching
  chat:
    parent: match
    overlay: true
    title: Chat line
  panel:
    parent: match
    overlay: true
    title: Panels
  unit-info:
    parent: match
    overlay: true
    title: Unit info
  megamap:
    parent: match
    overlay: true
    title: Megamap
  whiteboard:
    parent: match
    overlay: true
    title: Whiteboard
  placing:
    parent: play
    overlay: true
    title: Placing
  box:
    parent: match
    overlay: true
    title: Selection box

conditions:
  names: [single-player, multiplayer, seat, selection, developer, debug-keys, wheel-zoom, no-wheel-zoom]
  exclusive:
    - [single-player, multiplayer]
    - [wheel-zoom, no-wheel-zoom]

areas:
  orders:
    order: 1
    title: Orders
  mouse:
    order: 2
    title: Pointer
  selection:
    order: 3
    title: Selection
  groups:
    order: 4
    title: Groups
  camera:
    order: 5
    title: Camera
  building:
    order: 6
    title: Building
  game:
    order: 7
    title: Game
  chat:
    order: 8
    title: Chat
  watching:
    order: 9
    title: Watching
  window:
    order: 10
    title: Window
  menus:
    order: 11
    title: Menus
  developer:
    order: 12
    title: Developer
  megamap:
    order: 13
    title: Megamap
  whiteboard:
    order: 14
    title: Whiteboard

families:
  gui:
    area: menus
    context: [menus]
    kind: press
    by: letter
    source: [data]
    order-panel:
      area: orders
      context: [play]
  select.category:
    area: selection
    context: [play]
    kind: press
    by: letter
    source: [3.1c, data]
    default-template: "Ctrl+<letter>"

actions:
  order.move:
    area: orders
    order: 1
    context: [play]
    kind: press
    by: letter
    source: [3.1c, data]
    default: ["M"]
    gadget: MOVE
    touch: radial.move
    words: {name: "Move", description: "Arms Move"}
  order.stop:
    area: orders
    order: 2
    context: [play]
    kind: press
    by: letter
    source: [3.1c, data]
    default: ["S"]
    gadget: STOP
    pad: stop
    touch: radial.stop
    words: {name: "Stop", description: "Stop"}
  order.patrol:
    area: orders
    order: 3
    context: [play]
    kind: press
    by: letter
    source: [3.1c, data]
    default: ["P"]
    gadget: PATROL
    touch: radial.patrol
    words: {name: "Patrol", description: "Arms Patrol"}
  order.attack:
