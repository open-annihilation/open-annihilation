    implemented: true
    area: network
    summary: "Private add-on messages ride inside the chat packet: first text byte 0, then a sub-id; binary payloads go to their handlers, other lines to text listeners."
    ownership: all-machines
    scope: sim
    shorthand: framing
    params:
      framing: {type: enum, values: [none, sub-id-dispatch, integrity-only], baseline: none, default: sub-id-dispatch, adjustable: fixed, scope: sim}
    presets:
      baseline: {framing: none}
  network.vercheck:
    kind: hack
    title: Version Check
    implemented: true
    area: network
    summary: "Integrity challenge/response: each client challenges every other in-game human; answers are keyed hashes of loaded modules, the revision archive and CSV dumps of unit/weapon/feature tables; mismatches are reported, never blocked."
    ownership: all-machines
    scope: sim
    shorthand: revision
    params:
      revision: {type: enum, values: ["off", single-challenge, periodic-challenge], baseline: "off", default: single-challenge, adjustable: fixed, scope: sim}
    presets:
      baseline: {revision: "off"}
  network.vote-reject:
    kind: hack
    title: Vote to Remove Players
    implemented: true
    area: network
    summary: "The host's single reject/timeout dialog becomes a vote: a timed-out player, or one someone asks to reject, is removed on a majority of yes votes (teammate consent where applicable)."
    ownership: all-machines + host
    scope: sim
    params:
      vote-timeout-s: {type: int, min: 1, max: 3600, unit: s, baseline: 60, default: 60, adjustable: fixed, scope: sim}
      timeout-vote-s: {type: int, min: 1, max: 3600, unit: s, baseline: 90, default: 90, adjustable: fixed, scope: sim}
  network.lag-guard:
    kind: hack
    title: Lag Guard
    implemented: true
    area: network
    summary: "While no in-game remote player has been heard for 500 ms, the sim is allowed one step per 500 ms and the Pause hotkey is ignored."
    ownership: local-view
    scope: sim
    shorthand: gap-ms
    params:
      gap-ms: {type: int, min: 0, max: 60000, unit: ms, baseline: 0, default: 500, adjustable: fixed, scope: sim}
    presets:
      baseline: {gap-ms: 0}
  network.commander-start-sync:
    kind: hack
    title: Commander Start Sync
    implemented: true
    area: network
    summary: "At tick 90 each machine broadcasts position records for its local players' first units; receivers force the sender's first unit's integer x/z while tick < the per-player limit."
    ownership: all-machines
    scope: sim
    shorthand: tick
    params:
      tick: {type: int, min: 0, max: 30000, unit: ticks, baseline: 0, default: 90, adjustable: fixed, scope: sim}
    presets:
      baseline: {tick: 0}
  network.preserve-remote-player-colour:
    kind: hack
    title: Keep Remote Player Colours
    implemented: true
    area: network
    summary: "While a game runs, a remote player's colour and position slot is saved before and restored after a player-info packet."
    ownership: all-machines
    scope: sim
    params: {}
  network.session-desc-clear:
    kind: hack
    title: Clear Session Description
    implemented: true
    area: network
    summary: "The host clears one field of the session description before publishing it."
    ownership: host
    scope: sim
    params: {}
  network.host-stays-as-watcher:
    kind: hack
    title: Host Stays as Watcher
    implemented: true
    area: network
    summary: "A defeated host is kept in watch mode (with a message) instead of the exit prompt, so the session survives the host's defeat."
    ownership: host
    scope: sim
    params: {}
  network.recorder-session-commands:
    kind: hack
    title: Recorder Session Commands
    implemented: true
    area: network
    summary: "Opt-in recorder session commands: .autopause/.voteready/.ready (pause gating), .forcego/.votego (start), .fakewatch, .forcecd (in-memory no-CD), .f1off, .randmap/.randmapex (weighted random map from maps.txt)."
    ownership: all-machines
    scope: sim
    params:
      available: {type: bool, baseline: false, default: true, adjustable: fixed, scope: sim}
    presets:
      baseline: {available: false}
  recorder.ta-demo-recorder:
    kind: hack
    title: Game Recorder
    implemented: true
    area: recorder
    summary: "The recorder proxy is present: it records sessions, exchanges recorder-to-recorder traffic (status, cheat mask, reports, whiteboard and camera batches) and runs a memory cheat scanner."
    ownership: all-machines
    scope: sim
    params:
      header-version: {type: int, min: 1, max: 7, unit: version, baseline: 5, default: 5, adjustable: fixed, scope: sim}
      manual-extension: {type: string, pattern: "^\\.[A-Za-z0-9]{1,8}$", baseline: .tad, default: .tad, adjustable: fixed, scope: view}
      auto-extension: {type: string, pattern: "^\\.[A-Za-z0-9]{1,8}$", baseline: .tad, default: .tad, adjustable: fixed, scope: view}
      registry-root: {type: string, baseline: "", default: "", adjustable: fixed, scope: view}
      compress-files: {type: bool, baseline: true, default: true, adjustable: fixed, scope: view}
      cheat-notices: {type: bool, baseline: true, default: true, adjustable: fixed, scope: view}
      weapon-id-patch: {type: bool, baseline: false, default: false, adjustable: install, scope: sim, setting: {ini: Preferences/MultiGameWeapon}}
  recorder.ten-player-replay:
    kind: hack
    title: Ten-Player Replay
    implemented: true
    area: recorder
    summary: "Replay mode invents a local player id so a full 10-player recording can be watched: sends to it are dropped, the watcher has full radar, and received packets are filtered."
    ownership: local-view
    scope: sim
    shorthand: form
    params:
      form: {type: enum, values: ["off", watcher-view, allied-fake-player], baseline: "off", default: watcher-view, adjustable: fixed, scope: sim}
    presets:
      baseline: {form: "off"}

