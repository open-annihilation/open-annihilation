# The OAMOD registry, catalogue 1: every meaning an oamod.yaml can name, with
# its type, its 3.1c baseline and its default. tools/gen_mod_registry.py turns
# it into the engine's tables (src/data/mod-profile/src/registry_table.inc) and
# records (src/data/match-rules and src/data/mod-profile); the mod-registry-sync
# test fails when they differ from what this file gives.
#
# One entry per meaning: identity and layout values, limits, unit-script
# extensions, data keys, hacks (the ui.* hacks carry visual: true and view
# scope), and visual strings and media.
#
# Parameter fields
#   type        bool | int | decimal | string | enum | list<int> | list<decimal> | list<enum> | list<string> |
#               set<enum> | int-or-none (an int or the string none)
#   values      enum members; set<enum> values resolve in this order
#   min, max    inclusive bounds (element-wise for lists); multiple-of, length (n or [lo, hi]), order,
#               distinct, pattern and max-length (strings) further restrict a value
#   unit        what a number counts
#   baseline    the value that reproduces 3.1c; an absent entry behaves as if every parameter had it
#   default     the value used when the entry is on and nothing sets the parameter
#   default-from  {param, factor}: when nothing sets this parameter, it follows factor x that parameter
#   adjustable  fixed (only the profile sets it) | install (the game reads it from its INI or registry;
#               a profile binds it under settings) | match (as install, and the host may also change it for
#               one game)
#   scope       sim (part of the network-play hash) | view (local display, input, audio or files; not hashed)
#   setting     the INI (Section/Key) or registry value the game reads, for settings bindings
#   setting-transform  how a bound raw value becomes the parameter (see setting-transforms)
#   clamp-between  [lo, hi] parameters a bound or match value is clamped into
#   per-unit, per-weapon  the data-key meaning that overrides the parameter for one unit or weapon
#
# Entry fields: scope (sim | view) decides whether the entry's presence is hashed; ownership says which
# machines run the behaviour in a multiplayer game. Hacks: title is the name players see, in English and
# Title Case, unique among the hacks; area-titles names each area the same way; implemented says whether
# this engine carries the behaviour out; a profile that turns on a hack that is not implemented is
# refused unless the resolver is told to accept it. off says what a hack written false leaves, for a hack
# whose behaviour OA keeps when it is off (absent: 3.1c behaviour). Limits and hacks: shorthand names the single
# parameter a scalar value sets; constraints are checked after resolution; presets are complete
# parameter sets named for what they do, never for a mod (baseline equals the baselines and exists only
# when the entry can express 3.1c while on). Identity, layout, strings and media: key is the profile
# key, value its type and 3.1c baseline. Script extensions: direction and the default-index a list-form
# mount uses. Data keys: file (unit | weapon), standard-key (the usual spelling of the key), value
# (type; absent = what applies without the key), overrides (the parameter it replaces per unit) and
# requires (the hack that must be on). mutator: true lets a mutator's hacks block set this entry's match parameters for one game; refused on install-scoped entries and on entries that touch the interface.
#
# Resolution, lowest to highest: baseline (entry absent) -> default (entry on) -> preset -> profile file ->
# settings binding -> match option -> per-unit or per-weapon data key.
#
# Defaults: turning an entry on with no parameters gives the variant most mods use; a mod whose values
# differ writes them in its own profile.

registry: 1
catalogue: 1
types: [bool, int, decimal, string, enum, list<int>, list<decimal>, list<enum>, set<enum>, int-or-none]
resolution-order: [baseline, default, preset, profile, settings, match, per-unit]
setting-transforms:
  unit-type-bits: "raw v: 512 when v <= 512, else ((v >> 9) + 1) * 512"
profile-defaults:
  script-extensions: {fidelity: exact}
script-indices: {min: 0, max: 65535, base-range: [1, 20]}
# The name players see for each hack area, in English (the interface looks it
# up in its catalogue).
area-titles:
  ai: AI
  air: Aircraft
  console: Console
  economy: Economy
  intel: Vision and Radar
  network: Network
  orders: Orders
  recorder: Recorder
  repair: Repair
  setup: Game Setup
  sharing: Sharing
  teams: Teams
  ui: Interface
  units: Units
  veterancy: Veterancy
  weapons: Weapons

entries:

  # ---- identity (profile block identity)
  identity.settings-file:
    kind: identity
    area: paths
    summary: "Name of the configuration INI the game and its add-on libraries read."
    ownership: local-view
    scope: view
    key: settings-file
    value: {type: string, max-length: 64, baseline: totala.ini, scope: view}
  identity.registry-root:
    kind: identity
    area: paths
    summary: Registry root for TA settings renamed.
    ownership: local-view
    scope: view
    key: registry-root
    value: {type: string, max-length: 128, baseline: "Software\\\x43\x61\x76\x65\x64\x6F\x67 Entertainment", scope: view}
  identity.network-version:
    kind: identity
    area: network
    summary: "Multiplayer version bytes; peers must match, and replays present their own version."
    ownership: all-machines
    scope: sim
    key: network-version
    value: {type: list<int>, length: 2, min: 0, max: 255, baseline: [3, 1], scope: sim}
  identity.replay-network-version:
    kind: identity
    area: network
    summary: "Multiplayer version bytes a replay client reports to the replayer."
    ownership: all-machines
    scope: sim
    key: replay-network-version
    value: {type: list<int>, length: 2, min: 0, max: 255, baseline: [3, 1], scope: sim}
  identity.display-version:
    kind: identity
    area: ui
    summary: Main-menu version text.
    ownership: local-view
    scope: view
    key: display-version
    value: {type: string, max-length: 16, baseline: v3.1, scope: view}

  # ---- layout (profile block layout)
  layout.revision-archive:
    kind: layout
    area: paths
    summary: "Revision-slot archive rev31.gp3 is replaced; rev31.gp3 is no longer mounted."
    ownership: all-machines
    scope: sim
    key: revision-archive
    value: {type: string, max-length: 64, baseline: rev31.gp3, scope: sim}
  layout.installation-archives:
    kind: layout
    area: paths
    summary: "Archives from the game installation, mounted in the order written after the mod's own ccx and ufo archives and before the hpi group; a name here is not also mounted with its group."
    ownership: all-machines
    scope: sim
    key: installation-archives
    value: {type: list<string>, length: [0, 16], max-length: 64, distinct: true, pattern: '^(?!\.\.?$)[^/\\:]+$', baseline: [], scope: sim}
  layout.directories.gamedata:
    kind: layout
    area: paths
    summary: "Game-data directory (sidedata, moveinfo, sound, LOS, help, translate) is renamed with replace semantics."
    ownership: all-machines
    scope: sim
    key: directories.gamedata
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: gamedata, scope: sim}
  layout.directories.guis:
    kind: layout
    area: paths
    summary: GUI (build-menu page) directory renamed.
    ownership: all-machines
    scope: sim
    key: directories.guis
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: guis, scope: sim}
  layout.directories.unitpics:
    kind: layout
    area: paths
    summary: Build-picture directory renamed.
    ownership: all-machines
    scope: sim
    key: directories.unitpics
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: unitpics, scope: sim}
  layout.directories.weapons:
    kind: layout
    area: paths
    summary: Weapon TDF directory and scan pattern renamed.
    ownership: all-machines
    scope: sim
    key: directories.weapons
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: Weapons, scope: sim}
  layout.directories.download:
    kind: layout
    area: paths
    summary: Download (MENUENTRY build-menu TDF) directory renamed.
    ownership: all-machines
    scope: sim
    key: directories.download
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: download, scope: sim}
  layout.directories.units:
    kind: layout
    area: paths
    summary: "Unit definition directory renamed."
    ownership: all-machines
    scope: sim
    key: directories.units
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: units, scope: sim}
  layout.directories.ai:
    kind: layout
    area: paths
    summary: "AI profile directory renamed."
    ownership: all-machines
    scope: sim
    key: directories.ai
    value: {type: string, max-length: 32, pattern: '^(?!\.\.?$)[^/\\:]*$', baseline: ai, scope: sim}
  layout.cd-check:
    kind: layout
    area: paths
    summary: "CD archive branch and CD identity check are bypassed; archives always mount from the install directory."
    ownership: all-machines
    scope: sim
    key: cd-check
    value: {type: bool, baseline: true, scope: sim}
  layout.map-units-section:
    kind: layout
    area: paths
    summary: "Map schema section that holds mission unit placements; the original reuses the units directory string, so a mod that renames the directory renames the section too."
    ownership: all-machines
    scope: sim
    key: map-units-section
    value: {type: string, max-length: 32, baseline: units, scope: sim}

  # ---- limits (profile block limits; ids without the limits. prefix)
  limits.units-per-player:
    kind: limit
    area: limits
    summary: "Per-player unit cap: the registry default, clamp test and clamp value (3.1c 250/500/500) all become 1500."
    ownership: host + all-machines
    scope: sim
    mutator: true
    params:
      default: {type: int, min: 1, max: 6553, unit: units, baseline: 250, default: 1500, adjustable: match, scope: sim, setting: {registry: UnitLimit}, clamp-between: [min, max]}
      min: {type: int, min: 1, max: 6553, unit: units, baseline: 20, default: 20, adjustable: fixed, scope: sim}
      max: {type: int, min: 1, max: 6553, unit: units, baseline: 500, default: 1500, adjustable: fixed, scope: sim}
      limits-screen-fallback: {type: int, min: 1, max: 6553, unit: units, baseline: 101, default: 1500, adjustable: install, scope: view, setting: {ini: Preferences/UnitLimit}}
    constraints: [min <= default, default <= max]
    presets:
      baseline: {default: 250, min: 20, max: 500, limits-screen-fallback: 101}
  limits.unit-types:
    kind: limit
    area: limits
    summary: "Unit-type bitsets (AI type weight/limit commands, per-type category bitsets, same-type select) widen past 512 type ids."
    ownership: all-machines
    scope: sim
    params:
      bitset-bits: {type: int, min: 512, max: 65536, multiple-of: 512, unit: bits, baseline: 512, default: 16384, adjustable: install, scope: sim, setting: {ini: Preferences/UnitType}, setting-transform: unit-type-bits}
      partial-widening: {type: bool, baseline: false, default: false, adjustable: fixed, scope: sim}
    presets:
      baseline: {bitset-bits: 512, partial-widening: false}
  limits.effects:
    kind: limit
    area: limits
    summary: "Special-effect queue cap 400 -> 20480; the static effect-vector reserve becomes cap×10."
    ownership: local-view
    scope: view
    params:
      queue: {type: int, min: 1, max: 1000000, unit: effects, baseline: 400, default: 20480, adjustable: install, scope: view, setting: {ini: Preferences/SfxLimit}}
      reserve: {type: int, min: 1, max: 10000000, unit: effects, baseline: 1000, default: 204800, default-from: {param: queue, factor: 10}, adjustable: fixed, scope: view}
    presets:
      baseline: {queue: 400, reserve: 1000}
  limits.path-search-budget:
    kind: limit
    area: limits
    summary: "Pathfinder node budget per search: 1333 -> 66650."
    ownership: owner-only
    scope: sim
    shorthand: nodes
    params:
      nodes: {type: int, min: 1, max: 10000000, unit: nodes, baseline: 1333, default: 66650, adjustable: install, scope: sim, setting: {ini: Preferences/AISearchMapEntries}}
    presets:
      baseline: {nodes: 1333}
  limits.model-composite:
    kind: limit
    area: limits
    summary: "Unit model composite buffer 600×600 -> 1280×1280, optionally clamping oversize composites to the buffer."
    ownership: local-view
    scope: view
    params:
      width: {type: int, min: 64, max: 8192, unit: pixels, baseline: 600, default: 1280, adjustable: fixed, scope: view}
      height: {type: int, min: 64, max: 8192, unit: pixels, baseline: 600, default: 1280, adjustable: fixed, scope: view}
      clamp-oversize: {type: bool, baseline: false, default: true, adjustable: fixed, scope: view}
    presets:
      baseline: {width: 600, height: 600, clamp-oversize: false}
  limits.build-list-entries:
    kind: limit
    area: limits
    summary: "Per-builder SIDEDATA [CANBUILD] list (the skirmish AI build table) copies 36 entries instead of 30."
    ownership: owner-only
    scope: sim
    params:
      copy: {type: int, min: 1, max: 1024, unit: entries, baseline: 30, default: 36, adjustable: fixed, scope: sim}
      overflow: {type: enum, values: [truncate, dynamic], baseline: truncate, default: truncate, adjustable: fixed, scope: sim}
    presets:
      baseline: {copy: 30, overflow: truncate}
  limits.category-mask-types:
    kind: limit
    area: limits
    summary: "Unit type ids a category mask can hold; ids at or past the width lose category membership."
    ownership: all-machines
    scope: sim
    shorthand: types
    params:
      types: {type: int, min: 512, max: 65536, multiple-of: 512, unit: type ids, baseline: 512, default: 512, adjustable: fixed, scope: sim}
    presets:
      baseline: {types: 512}
  limits.weapon-types:
    kind: limit
    area: limits
    summary: "Weapon ids a mod may number: 3.1c's 256, ids 0 to 255, up to 65,536. Raised, it plays only between Open Annihilation machines."
    ownership: all-machines
    scope: sim
    shorthand: types
    params:
      types: {type: int, min: 256, max: 65536, unit: weapon types, baseline: 256, default: 4096, adjustable: fixed, scope: sim}
    presets:
      baseline: {types: 256}
  limits.sides:
    kind: limit
    area: limits
    summary: "SIDEDATA sides a mod may load: 3.1c's five, up to 32."
    ownership: all-machines
    scope: sim
    shorthand: count
    params:
      count: {type: int, min: 5, max: 32, unit: sides, baseline: 5, default: 10, adjustable: fixed, scope: sim}
    presets:
      baseline: {count: 5}

  # ---- script extensions (profile block script-extensions)
  unit.kills-x100:
    kind: script-ext
    area: script
    summary: "COB get 32 returns the calling unit's kill count × 100."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 32
  unit.min-id:
    kind: script-ext
    area: script
    summary: COB get 69 returns the lowest unit slot id (constant 1).
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 69
  unit.max-id:
    kind: script-ext
    area: script
    summary: "COB get 70 returns the highest unit slot id: per-player unit maximum × 10."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 70
  unit.my-id:
    kind: script-ext
    area: script
    summary: "COB get 71 returns the calling unit's own slot id."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 71
  unit.owner-of:
    kind: script-ext
    area: script
    summary: COB get 72(id) returns the owner player index of unit id.
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 72
  unit.build-percent-left-of:
    kind: script-ext
    area: script
    summary: "COB get 73(id) runs the base BUILD_PERCENT_LEFT formula on unit id (0 when complete, else 1 + trunc(99 × fraction))."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 73
  unit.allied-with:
    kind: script-ext
    area: script
    summary: "COB get 74(id) returns 1 when the caller's owner has allied the target's owner."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 74
  unit.is-local:
    kind: script-ext
    area: script
    summary: "COB get 75(id) returns 1 when the target unit's owner is simulated on this machine (controller 1 local human or 2 local AI)."
    ownership: all-machines
    scope: sim
    direction: get
    default-index: 75

  # ---- data keys (profile block data-keys: file key -> meaning)
  weapons.not-to-air:
    kind: data-key
    area: weapons
    summary: "Weapon TDF key nottoair=1: the weapon may not target airborne units."
    ownership: owner-only
    scope: sim
    file: weapon
    standard-key: nottoair
    value: {type: int, min: 0, max: 2147483647, absent: 0}
  weapons.surface-fire:
    kind: data-key
    area: weapons
    summary: "Weapon TDF key surfacefire=1: a waterweapon may also engage surface, air-above-water and ground-position targets, and its projectile flies normally above sea level."
    ownership: owner-only + all-machines
    scope: sim
    file: weapon
    standard-key: surfacefire
    value: {type: int, min: 0, max: 2147483647, absent: 0}
  weapons.not-to-underwater:
    kind: data-key
    area: weapons
    summary: "Weapon TDF key nottounderwater=1: on the waterweapon path a target whose top is at or below sea level is out of range."
    ownership: owner-only
    scope: sim
    file: weapon
    standard-key: nottounderwater
    value: {type: int, min: 0, max: 2147483647, absent: 0}
  weapons.no-map-alert:
    kind: data-key
    area: weapons
    summary: "Weapon TDF key nomapweaponalert=1: an ownerless projectile whose [DAMAGE] default is 0 skips the area explosion and draws no minimap weapon alert."
    ownership: all-machines
    scope: sim
    file: weapon
    standard-key: nomapweaponalert
    value: {type: int, min: 0, max: 2147483647, absent: 0}
  veterancy.thresholds:
    kind: data-key
    area: veterancy
    summary: "FBI key VeterancyThresholds: ascending kill counts for each veterancy level of this unit type."
    ownership: all-machines / owner-only
    scope: sim
    file: unit
    standard-key: VeterancyThresholds
    value: {type: list<int>, length: [0, 32], min: 0, max: 65535, order: ascending, unit: kills, absent: veterancy.model.default-thresholds}
    overrides: veterancy.model.default-thresholds
    requires: veterancy.model
  veterancy.accuracy-rate:
    kind: data-key
    area: veterancy
    summary: "FBI key VeterancyAccuracyBuffRate: kills per unit of ballistic spread reduction (0 = no accuracy buff)."
    ownership: all-machines / owner-only
    scope: sim
    file: unit
    standard-key: VeterancyAccuracyBuffRate
    value: {type: int, min: 0, max: 65535, unit: kills, absent: veterancy.model.accuracy-rate-default}
    overrides: veterancy.model.accuracy-rate-default
    requires: veterancy.model
  units.build-facings:
    kind: data-key
    area: units
    summary: "FBI key Rotations: facings (letters from S E N W) a building may be placed in."
    ownership: all-machines
    scope: sim
    file: unit
    standard-key: Rotations
    value: {type: string, pattern: "^[SENW]{1,4}$", absent: S}
    requires: units.build-rotation
  ui.preview-pieces:
    kind: data-key
    area: ui
    visual: true
    summary: "FBI keys PreviewPieces, PreviewPiecesS/E/N/W, PreviewObject3D, PreviewFaceOpponent: build-cursor ghost only."
    ownership: local-view
    scope: view
    file: unit
    standard-key: PreviewPieces
    value: {type: string, absent: ""}
    requires: ui.build-preview
  ui.preview-pieces-by-facing:
    kind: data-key
    area: ui
    visual: true
    summary: "FBI keys PreviewPieces, PreviewPiecesS/E/N/W, PreviewObject3D, PreviewFaceOpponent: build-cursor ghost only."
    ownership: local-view
    scope: view
    file: unit
    standard-key: "PreviewPieces{S,E,N,W}"
    value: {type: string, absent: ""}
    requires: ui.build-preview
  ui.preview-object:
    kind: data-key
    area: ui
    visual: true
    summary: "FBI keys PreviewPieces, PreviewPiecesS/E/N/W, PreviewObject3D, PreviewFaceOpponent: build-cursor ghost only."
    ownership: local-view
    scope: view
    file: unit
    standard-key: PreviewObject3D
    value: {type: string, absent: ""}
    requires: ui.build-preview
  ui.preview-face-opponent:
    kind: data-key
    area: ui
    visual: true
    summary: "FBI keys PreviewPieces, PreviewPiecesS/E/N/W, PreviewObject3D, PreviewFaceOpponent: build-cursor ghost only."
    ownership: local-view
    scope: view
    file: unit
    standard-key: PreviewFaceOpponent
    value: {type: int, absent: 0, min: 0, max: 1}
    requires: ui.build-preview

  # ---- hacks (profile block hacks)
  ai.income-multipliers:
    kind: hack
    title: Income Multipliers
    implemented: true
    area: ai
    summary: AI (controller type 2) production and feature-reclaim income multiplier per difficulty index.
    ownership: owner-only
    scope: sim
    params:
      production: {type: list<decimal>, min: 0, max: 100, length: 3, unit: x income, baseline: [0.5, 0.7, 1.0], default: [0.5, 1.0, 4.0], adjustable: fixed, scope: sim}
      reclaim: {type: list<decimal>, min: 0, max: 100, length: 3, unit: x income, baseline: [0.5, 0.7, 1.0], default: [0.5, 1.0, 4.0], adjustable: fixed, scope: sim}
    presets:
      baseline: {production: [0.5, 0.7, 1.0], reclaim: [0.5, 0.7, 1.0]}
  ai.difficulty-names:
    kind: hack
    title: Difficulty Names
    implemented: true
    area: ai
    summary: "Difficulty index/name tables (AI profile keywords, upper-case keywords, display names): Easy and Hard swap places."
    ownership: owner-only + local-view
    scope: sim
    shorthand: names
    params:
      names: {type: list<enum>, values: [easy, medium, hard], length: 3, distinct: true, baseline: [easy, medium, hard], default: [hard, medium, easy], adjustable: fixed, scope: sim}
    presets:
      baseline: {names: [easy, medium, hard]}
  ai.squad5-factory-tick:
    kind: hack
    title: Commander Runs Factories
    implemented: true
    area: ai
    summary: "The AI commander's third task (squad 5) runs the factory/economy tick instead of a no-op, so the AI builds and fires stockpile weapons from builder=1 silos."
    ownership: owner-only
    scope: sim
    params: {}
  ai.factory-tick-filter:
    kind: hack
    title: Factory Tick Filter
    implemented: true
    area: ai
    summary: "AI factory/economy tick skips buildings with a non-empty background order queue and applies the energy on/off toggle to any building with EnergyUse >= 32 (3.1c: MakesMetal != 0)."
    ownership: owner-only
    scope: sim
    params:
      skip-busy-background-queue: {type: bool, baseline: false, default: true, adjustable: fixed, scope: sim}
      power-toggle: {type: enum, values: [makes-metal, energy-use-32], baseline: makes-metal, default: energy-use-32, adjustable: fixed, scope: sim}
    presets:
      baseline: {skip-busy-background-queue: false, power-toggle: makes-metal}
  ai.builder-withhold-threshold:
    kind: hack
    title: Commander Builder Limit
    implemented: true
    area: ai
    summary: A commander-class (cancapture) AI builder is withheld from builder jobs once the AI owns N builder-capable units.
    ownership: owner-only
    scope: sim
    shorthand: builders
    params:
      builders: {type: int, min: 0, max: 1500, unit: builders, baseline: 5, default: 10, adjustable: fixed, scope: sim}
    presets:
      baseline: {builders: 5}
  ai.commander-keeps-orders-when-damaged:
    kind: hack
    title: Commander Keeps Orders When Hit
    implemented: true
    area: ai
    summary: A damaged AI-owned cancapture unit no longer sets the AI response timer and clears its order queue.
    ownership: owner-only
    scope: sim
    params: {}
  ai.attack-wave-size:
    kind: hack
    title: Attack Wave Size
    implemented: true
    area: ai
    summary: "Both AI group-attack tasks (land, naval) launch an attack wave at N units."
    ownership: owner-only
    scope: sim
    shorthand: units
    params:
      units: {type: int, min: 1, max: 1500, unit: units, baseline: 6, default: 10, adjustable: fixed, scope: sim}
    presets:
      baseline: {units: 6}
  ai.patrol-group-size:
    kind: hack
    title: Patrol Group Size
    implemented: true
    area: ai
    summary: The AI patrol/scout task sends its group to a random map-edge point only once it has N units.
    ownership: owner-only
    scope: sim
    shorthand: units
    params:
